<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Advanced PPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Bebas+Neue&family=Caveat:wght@700&family=Cinzel:wght@700&family=DM+Serif+Display&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Lobster&family=Manrope:wght@500;700;800&family=Orbitron:wght@700&family=Pacifico&family=Playfair+Display:wght@700&family=Press+Start+2P&family=Rajdhani:wght@600;700&family=Righteous&family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&family=Syne:wght@700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--g:#ffc45c;--ui:#0d1a16;--ln:#ffffff1f;--tx:#f5efe0;--mu:#a9b8b0}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@property --num{syntax:"<integer>";initial-value:0;inherits:false}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#060d0b;color:var(--tx);font:500 14px Manrope,system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{background:#ffffff0d;border:1px solid var(--ln);border-radius:8px;padding:7px 12px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}button:active{transform:scale(.96)}
button:hover{border-color:var(--g)}button.on{background:var(--g);color:#1a1202;border-color:var(--g);font-weight:800}
input,textarea,select{background:#00000040;border:1px solid var(--ln);border-radius:7px;padding:6px 8px;width:100%}
input[type=color]{padding:0;height:32px}input[type=checkbox]{width:auto}
:focus-visible{outline:2px solid var(--g);outline-offset:1px}
[hidden]{display:none!important}
#top{display:flex;gap:8px;align-items:center;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--ui);border-bottom:1px solid var(--ln);flex-wrap:wrap}
#ttl{width:220px;font:700 15px Fraunces,Georgia,serif}.sp{flex:1}#st{color:var(--mu);font-size:12px}
main{display:grid;grid-template-columns:172px 1fr 310px;min-height:0}
#slc{background:var(--ui);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
#thumbs{flex:1;overflow:auto;padding:10px;display:grid;gap:10px;align-content:start;justify-items:center;--ts:.109375}
.th{position:relative;cursor:pointer;border:2px solid transparent;border-radius:6px}.th.cur{border-color:var(--g)}
.th b{position:absolute;left:4px;top:2px;font-size:11px;background:#000a;border-radius:4px;padding:0 5px;z-index:3}
.tf{width:140px;height:79px;position:relative;overflow:hidden;border-radius:4px;pointer-events:none}
.tn{transform:scale(var(--ts))}.tn *{animation:none!important}.tn .ob{opacity:1!important}
.srow{display:flex;flex-wrap:wrap;gap:5px;padding:8px;border-top:1px solid var(--ln)}.srow button{padding:4px 8px;font-size:12px}
#stagebox{min-width:0;min-height:0;display:flex;flex-direction:column;background:radial-gradient(circle,#111f1a,#050a08)}
#fr{position:relative;box-shadow:0 20px 70px #000;border-radius:6px;overflow:hidden;margin:auto;flex:none}
#side{background:var(--ui);border-left:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;gap:6px;padding:8px}#tabs button{flex:1}
#pane{flex:1;overflow:auto;padding:0 10px 14px;display:grid;gap:8px;align-content:start;scroll-behavior:smooth}
#pane label{display:grid;gap:3px;color:var(--mu);font-size:12px}
#pane h4{font:700 15px Fraunces,serif;color:var(--g);margin-top:6px}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:7px}.lib button{display:flex;gap:8px;align-items:center;text-align:left;padding:8px;font-size:12px}.lib span{font-size:18px;width:22px;text-align:center}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns{display:flex;flex-wrap:wrap;gap:6px}.btns button{padding:5px 9px;font-size:12px}
#modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50}
.mb{background:var(--ui);border:1px solid var(--g);border-radius:14px;padding:18px;width:min(460px,92vw);max-height:80vh;overflow:auto;display:grid;gap:8px}
.mb h3{font:700 22px Fraunces,serif;color:var(--g)}.dr{display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--ln);padding:6px 0}.dr span{flex:1}.dr small{display:block;color:var(--mu)}
#pres{position:fixed;inset:0;background:#000;z-index:60}.pc{position:fixed;left:50%;bottom:12px;translate:-50% 0;font:700 12px Manrope;color:#fff8;z-index:3}
@media(max-width:860px){main{grid-template-columns:1fr;grid-template-rows:auto 1fr 40vh}#slc{flex-direction:row;border-right:0;border-bottom:1px solid var(--ln);overflow-x:auto}#thumbs{display:flex;padding:6px;overflow:visible}.th{flex:none}.srow{flex-direction:column;border:0}#side{border-left:0;border-top:1px solid var(--ln)}#ttl{width:140px}}

#qa{display:flex;gap:6px;align-items:center;padding:6px 10px;min-height:44px;flex-wrap:wrap;background:var(--ui);border-bottom:1px solid var(--ln)}#qa button{padding:4px 9px;font-size:12px}.sep{width:1px;height:20px;background:var(--ln)}.hint{color:var(--mu);font-size:12px}
#sw{flex:1;min-height:0;overflow:auto;display:flex;padding:12px}
#sb{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--ui);border-top:1px solid var(--ln)}#sb button{padding:4px 10px;font-size:12px}#zl{min-width:44px;text-align:center;font-size:12px;color:var(--mu)}
#tip{background:#ffc45c1a;border-bottom:1px solid var(--g);padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px}#tip[hidden]{display:none}
details{border:1px solid var(--ln);border-radius:10px;background:#ffffff05}summary{cursor:pointer;padding:8px 10px;font:700 14px Fraunces,serif;color:var(--g);list-style:none}summary::-webkit-details-marker{display:none}summary:before{content:'▸ '}details[open]>summary:before{content:'▾ '}.sbd{display:grid;gap:8px;padding:0 10px 10px}
.rr{display:flex;gap:8px;align-items:center}.rr input{flex:1;padding:0;border:0;background:none;accent-color:#ffc45c}.rr output{width:36px;text-align:right;font-size:12px}
.fin{animation:fin .28s ease}@keyframes fin{from{opacity:.25;transform:scale(.985)}}
.ly{cursor:pointer;border-radius:6px;padding-left:4px}.ly.cur{background:#ffc45c1c}.th{transition:border-color .15s,transform .15s}.th:hover{transform:translateY(-1px)}
.pw{position:absolute;inset:0;animation:var(--trn,none) .6s ease both}
@keyframes trfade{from{opacity:0}}@keyframes trslide{from{transform:translateX(7%);opacity:0}}@keyframes trzoom{from{transform:scale(.88);opacity:0}}@keyframes trflip{from{transform:perspective(1400px) rotateY(55deg);opacity:0}}@keyframes trwipe{from{clip-path:inset(0 100% 0 0)}}
.pn{position:fixed;left:0;right:0;bottom:0;background:#000c;color:#fff;padding:14px 24px 30px;font-size:20px;z-index:4}.pg{position:fixed;left:0;bottom:0;height:3px;background:var(--g);transition:width .4s;z-index:5}

#dlg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:70}#dlg[hidden]{display:none}.dlg p{color:var(--mu);line-height:1.5}.dng{background:#ff5a5a!important;color:#240000!important;border-color:#ff5a5a!important;font-weight:800}
.cs{width:100%;height:32px;padding:0;border-radius:7px}.cp{display:block}
#cpk{position:fixed;z-index:80;left:0;top:0}#cpk[hidden]{display:none}.cpb{background:var(--ui);border:1px solid var(--g);border-radius:12px;padding:10px;display:grid;gap:8px;box-shadow:0 18px 50px #000}.cph{display:flex;justify-content:space-between;align-items:center}.cpv{height:34px;border-radius:8px;border:1px solid var(--ln)}
.cpb label{display:grid;gap:3px;color:var(--mu);font-size:12px}.cpb input[type=range]{padding:0;border:0;background:none;accent-color:#ffc45c}
#ch{-webkit-appearance:none;appearance:none;height:12px;border-radius:6px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)!important}#ch::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #000}#ch::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #000}
.csw{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}.csw button{height:22px;padding:0;border-radius:6px}
#tour{position:fixed;inset:0;z-index:90}#tour[hidden]{display:none}
.tsp{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px #000b,0 0 0 3px #ffc45c;pointer-events:none;transition:all .35s ease}
.tcard{position:fixed;width:min(320px,calc(100vw - 20px));background:var(--ui);border:1px solid var(--g);border-radius:14px;padding:14px;display:grid;gap:8px;box-shadow:0 18px 50px #000;transition:left .35s ease,top .35s ease}.tcard h3{font:700 20px Fraunces,serif;color:var(--g)}.tcard p{line-height:1.5;font-size:14px}.tcard small{color:var(--mu)}
#toast{position:fixed;left:50%;bottom:22px;translate:-50% 20px;background:var(--ui);border:1px solid var(--g);border-radius:10px;padding:9px 16px;opacity:0;pointer-events:none;transition:.3s;z-index:95;font-size:13px;max-width:92vw;text-align:center}#toast.on{opacity:1;translate:-50% 0}
.tabhint{background:#ffc45c14;border:1px solid #ffc45c33;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45}
.empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;color:#ffffffd0;font-size:15px;line-height:1.6;padding:24px;text-shadow:0 2px 10px #000}.empty b{color:#ffc45c;font-size:18px}

/* ===== SLIDE + OBJECT STYLES (the "special effects") ===== */
.sl{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;color:var(--ink);--mut:color-mix(in srgb,var(--ink) 78%,var(--bg));font-family:var(--fb);
background:radial-gradient(900px 500px at 85% 0,color-mix(in srgb,var(--a2) 13%,transparent),transparent 60%),radial-gradient(700px 500px at 0 100%,color-mix(in srgb,var(--a1) 11%,transparent),transparent 60%),var(--bg)}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.3;animation:dr 18s ease-in-out infinite alternate}
.o1{width:520px;height:520px;background:var(--a2);left:-140px;top:-120px}.o2{width:460px;height:460px;background:var(--a1);right:-120px;bottom:-120px;animation-delay:-7s}
@keyframes dr{to{transform:translate(90px,-60px) scale(1.2)}}
.ob{position:absolute;user-select:none;touch-action:none;cursor:move}.ob[data-lk]{cursor:default}.in{width:100%;height:100%}
.in[data-b] *{font-weight:800!important}.in[data-i] *{font-style:italic!important}.in[data-u] *{text-decoration:underline!important}.in[data-up] *{text-transform:uppercase!important}.in[data-ls] *{letter-spacing:var(--ls)!important}.in[data-lh] *{line-height:var(--lh)!important}.ob [contenteditable=true]{user-select:text;outline:2px solid var(--a1)}
.ob.sel{outline:var(--os,2px) dashed #ffc45c;z-index:5}.hd,.rh{position:absolute;width:var(--hs,16px);height:var(--hs,16px);background:#ffc45c;border:calc(var(--hs,16px)/9) solid #000;z-index:9}.hd{right:calc(var(--hs,16px)/-2);bottom:calc(var(--hs,16px)/-2);border-radius:25%;cursor:nwse-resize}.rh{left:50%;top:calc(var(--hs,16px)*-2);margin-left:calc(var(--hs,16px)/-2);border-radius:50%;cursor:grab}
.gd{position:absolute;background:#ff3d9a;z-index:9999;pointer-events:none}.gv{top:0;bottom:0;width:var(--os,2px)}.gh{left:0;right:0;height:var(--os,2px)}
.am{width:100%;height:100%}
[data-am=float]{animation:fl 3.5s ease-in-out infinite}[data-am=pulse]{animation:pz 2s ease-in-out infinite}[data-am=swing]{animation:sw 3s ease-in-out infinite}
[data-am=spin]{animation:rt 18s linear infinite}[data-am=glow]{animation:gw 2.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px)}}@keyframes pz{50%{transform:scale(1.07)}}@keyframes sw{50%{transform:rotate(4deg)}25%{transform:rotate(-4deg)}}
@keyframes rt{to{transform:rotate(360deg)}}@keyframes gw{50%{filter:drop-shadow(0 0 22px var(--a1))}}
/* entrance effects start hidden through animation fill-mode (backwards), not a static opacity:0 */
.on .ob:not([data-an=none]){animation:var(--an) var(--du,.9s) cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
[data-an=rise]{--an:rise}[data-an=fade]{--an:fade}[data-an=zoom]{--an:zoomin}[data-an=left]{--an:lft}[data-an=right]{--an:rgt}[data-an=drop]{--an:drop}[data-an=blur]{--an:blr}[data-an=spin]{--an:spn}[data-an=flip]{--an:flipin}[data-an=bounce]{--an:bnc}[data-an=wipe]{--an:wp}
@keyframes flipin{from{opacity:0;transform:perspective(800px) rotateX(80deg)}}@keyframes bnc{0%{opacity:0;transform:translateY(-200px)}60%{opacity:1;transform:translateY(20px)}80%{transform:translateY(-8px)}}@keyframes wp{from{clip-path:inset(0 100% 0 0)}}
@keyframes rise{from{opacity:0;transform:translateY(40px)}}@keyframes fade{from{opacity:0}}@keyframes zoomin{from{opacity:0;transform:scale(.5)}}
@keyframes lft{from{opacity:0;transform:translateX(-120px)}}@keyframes rgt{from{opacity:0;transform:translateX(120px)}}@keyframes drop{from{opacity:0;transform:translateY(-120px)}}
@keyframes blr{from{opacity:0;filter:blur(24px)}}@keyframes spn{from{opacity:0;transform:rotate(-200deg) scale(.3)}}
.sh{background:linear-gradient(100deg,var(--ink) 30%,var(--a1) 44%,#fff 50%,var(--a1) 56%,var(--ink) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 5s linear infinite}
@keyframes sheen{from{background-position:100% 0}to{background-position:-100% 0}}
.sl .k{font:800 14px var(--fb);letter-spacing:.28em;color:var(--a1);display:flex;align-items:center;gap:14px;text-transform:uppercase}
.sl .k:before{content:"";width:46px;height:2px;background:linear-gradient(90deg,var(--a1),transparent)}
.sl .c{position:relative;padding:28px 32px;border-radius:22px;border:1.5px solid transparent;overflow:hidden;height:100%;animation:spin 6s linear infinite;
background:linear-gradient(color-mix(in srgb,var(--bg) 90%,var(--ink)),color-mix(in srgb,var(--bg) 95%,var(--ink))) padding-box,conic-gradient(from var(--a),color-mix(in srgb,var(--a1) 14%,transparent) 0 55%,var(--a1) 82%,color-mix(in srgb,var(--a1) 14%,transparent)) border-box}
@keyframes spin{to{--a:360deg}}
.sl .lb{font:800 13px var(--fb);letter-spacing:.24em;color:var(--a1);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sl .lb:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--a1);box-shadow:0 0 14px var(--a1);animation:bl 2s ease-in-out infinite}
@keyframes bl{50%{opacity:.35;transform:scale(.7)}}
.sl h3{font:600 28px/1.2 var(--fh);margin:12px 0;color:var(--ink)}.sl p{font-size:22px;line-height:1.5;color:var(--mut)}
.sl .n{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:700 22px var(--fh);background:var(--bg);border:2px solid var(--a1);color:var(--a1);animation:pu 2.6s ease-in-out infinite}
@keyframes pu{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--a1) 50%,transparent),0 0 20px color-mix(in srgb,var(--a1) 30%,transparent)}50%{box-shadow:0 0 0 14px transparent,0 0 36px color-mix(in srgb,var(--a1) 60%,transparent)}}
.stepper{position:relative;display:flex;justify-content:space-between;height:100%}
.stepper .dl{position:absolute;left:28px;right:28px;top:27px;height:3px;background:repeating-linear-gradient(90deg,var(--a1) 0 14px,transparent 14px 26px);animation:dash 1.2s linear infinite;opacity:.8}
@keyframes dash{to{background-position:26px 0}}
.stp{position:relative;z-index:1;width:56px;display:flex;flex-direction:column;align-items:center}.stp:nth-child(3) .n{animation-delay:.4s}.stp:nth-child(4) .n{animation-delay:.8s}.stp:nth-child(5) .n{animation-delay:1.2s}
.stp .t{margin-top:12px;font:700 19px var(--fb);color:var(--mut);white-space:nowrap}
.chips2{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.chip{padding:10px 24px;border-radius:99px;border:1px solid color-mix(in srgb,var(--a1) 50%,transparent);color:var(--a1);font:800 19px var(--fb);background:color-mix(in srgb,var(--a1) 8%,transparent);box-shadow:0 0 24px color-mix(in srgb,var(--a1) 20%,transparent);animation:fl 3.5s ease-in-out infinite}
.chip:nth-child(2n){animation-delay:-1.7s}.chip:nth-child(3n){animation-delay:-.8s}
.mt2{letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 0 8px;font-weight:700}
.m{height:12px;border-radius:9px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.m i{display:block;height:100%;width:var(--w);border-radius:9px;background:linear-gradient(90deg,var(--a2),var(--a1),var(--a2));background-size:200% 100%;animation:gr 1.4s .7s both,sheen 3s linear infinite}
@keyframes gr{from{width:0}}
.sl ul{list-style:none;padding:0}.sl li{line-height:1.35;color:var(--mut);padding:9px 0 9px 38px;position:relative;border-bottom:1px solid color-mix(in srgb,var(--ink) 10%,transparent);font-size:21px}.sl li:last-child{border:0}
.sl li:before{position:absolute;left:0;top:9px;font-weight:800}
.pro li:before{content:"✓";color:var(--a2);text-shadow:0 0 12px var(--a2)}.con li:before{content:"✕";color:#ff7b7b;text-shadow:0 0 12px #ff7b7b}
.pro h3{color:var(--a2)}.con h3{color:#ff7b7b}
.coin2{position:relative;width:100%;height:100%;perspective:900px}
.coin2 b{position:absolute;inset:16%;border-radius:50%;display:grid;place-items:center;font-family:var(--fh);color:#3a2200;background:radial-gradient(circle at 35% 30%,#fff2c2,var(--a1) 45%,color-mix(in srgb,var(--a1) 45%,#000));box-shadow:0 0 90px color-mix(in srgb,var(--a1) 60%,transparent);animation:fp 6s ease-in-out infinite}
@keyframes fp{to{transform:rotateY(360deg)}}
.coin2 i{position:absolute;inset:3%;border-radius:50%;border:1.5px dashed color-mix(in srgb,var(--a1) 50%,transparent);animation:rt 20s linear infinite}
.coin2 i+i{inset:-10%;border-color:color-mix(in srgb,var(--a2) 45%,transparent);animation-duration:32s;animation-direction:reverse}
.coin2 i:after{content:"";position:absolute;top:-7px;left:50%;width:13px;height:13px;border-radius:50%;background:var(--a1);box-shadow:0 0 20px var(--a1)}.coin2 i+i:after{background:var(--a2);box-shadow:0 0 20px var(--a2)}
.tick{height:100%;border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent);border-bottom:1px solid color-mix(in srgb,var(--ink) 14%,transparent);overflow:hidden;white-space:nowrap;display:flex;align-items:center;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.tick div{display:inline-block;font:800 15px var(--fb);letter-spacing:.3em;text-transform:uppercase;color:var(--a1);animation:mq 28s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
.trk2{height:4px;margin-top:20px;border-radius:4px;background:linear-gradient(90deg,var(--a2),var(--a1));position:relative;box-shadow:0 0 18px color-mix(in srgb,var(--a1) 50%,transparent)}
.trk2:after{content:"";position:absolute;top:-8px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 24px 6px var(--a1);animation:mv 4s ease-in-out infinite alternate}@keyframes mv{from{left:0}to{left:calc(100% - 20px)}}
.sl table{width:100%;border-collapse:separate;border-spacing:0 8px}
.sl th{font:800 .65em var(--fb);letter-spacing:.2em;text-transform:uppercase;text-align:left;padding:6px 20px;color:var(--a1)}
.sl td{padding:12px 20px;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--mut)}.sl td:first-child{border-radius:14px 0 0 14px;color:var(--ink);font-weight:700}.sl td:last-child{border-radius:0 14px 14px 0}
.cw{display:flex;align-items:baseline;justify-content:center;height:100%;color:var(--a1);font-family:var(--fh);font-weight:800;text-shadow:0 0 30px color-mix(in srgb,var(--a1) 50%,transparent)}
.cn{counter-reset:n var(--num);animation:cnt 2.4s ease-out both}.cn:after{content:counter(n)}@keyframes cnt{from{--num:0}to{--num:var(--to)}}
.qt{height:100%;padding-left:30px;border-left:4px solid var(--a1);font-family:var(--fh);color:var(--ink);position:relative}.qt small{display:block;margin-top:12px;font:700 .5em var(--fb);color:var(--a1);letter-spacing:.15em;text-transform:uppercase}
.dv{width:100%;height:100%;background:repeating-linear-gradient(90deg,var(--a1) 0 14px,transparent 14px 26px);animation:dash 1.2s linear infinite}.dv.v{background:repeating-linear-gradient(180deg,var(--a1) 0 14px,transparent 14px 26px);animation-name:dashv}@keyframes dashv{to{background-position:0 26px}}
.rg{width:100%;height:100%;border-radius:50%;border:6px solid color-mix(in srgb,var(--a1) 20%,transparent);border-top-color:var(--a1);animation:rt 1.2s linear infinite;box-shadow:0 0 30px color-mix(in srgb,var(--a1) 40%,transparent)}

function shrink(f){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const png=/png|gif|svg/.test(f.type),m=png?800:1100,k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL(png?'image/png':'image/jpeg',.74))};i.src=r.result};r.readAsDataURL(f)})}

function addObj(k){snap(true);const o=mk(k),n=deck.slides[cur].objs.length%6;o.x=Math.round((1280-o.w)/2)+n*22;o.y=Math.round((720-o.h)/2)+n*22;if(k=='ticker'||k=='orb'){o.x=Math.max(0,o.x-n*22);o.y=o.y-n*22}deck.slides[cur].objs.push(o);render();select(o.id);changed();const el=$('#fr [data-id="'+o.id+'"]');if(el){el.classList.add('ins');el.addEventListener('animationend',()=>el.classList.remove('ins'),{once:true})}toast('Added “'+T[k].n+'”. Drag it into place or fine-tune it in Format.')}
function dupObj(){const o=curObj();if(!o)return;snap(true);const c=JSON.parse(JSON.stringify(o));c.id=uid();c.x+=30;c.y+=30;deck.slides[cur].objs.push(c);render();select(c.id);changed()}
function delObj(){if(!sel)return;snap(true);deck.slides[cur].objs=deck.slides[cur].objs.filter(o=>o.id!=sel);sel=null;render();select(null);changed()}
function doOp(op){const o=curObj();if(!o)return;const a=deck.slides[cur].objs,i=a.indexOf(o);
 if(op=='dup')return dupObj();if(op=='del')return delObj();snap(true);
 if(op=='front'){a.push(a.splice(i,1)[0]);render()}else if(op=='back'){a.unshift(a.splice(i,1)[0]);render()}else if(op=='lock'){o.lk=!o.lk;redraw(o)}
 changed();thumbOne();if(tab=='edit')pane()}
function tgl(k){const o=curObj();if(!o)return;snap(true);o.ts=o.ts||{};o.ts[k]=!o.ts[k];redraw(o);changed();if(tab=='edit')pane()}
function setAl(a){const o=curObj();if(!o)return;snap(true);o.ts=o.ts||{};o.ts.al=a;redraw(o);changed();if(tab=='edit')pane()}
function alignTo(a){const o=curObj();if(!o)return;snap(true);if(a=='l')o.x=40;if(a=='c')o.x=Math.round((1280-o.w)/2);if(a=='r')o.x=1280-o.w-40;if(a=='t')o.y=40;if(a=='m')o.y=Math.round((720-o.h)/2);if(a=='b')o.y=720-o.h-40;redraw(o);changed();pane()}

$('#pane').addEventListener('click',async e=>{const ly=e.target.closest('[data-ly]');if(ly&&!e.target.closest('button')){select(ly.dataset.ly);return}

/* ---------- drag / resize / rotate / snap ---------- */
const fr=$('#fr');
function snapPos(o,x,y){const xs=[0,640,1280],ys=[0,360,720];deck.slides[cur].objs.forEach(p=>{if(p!==o){xs.push(p.x,p.x+p.w/2,p.x+p.w);ys.push(p.y,p.y+p.h/2,p.y+p.h)}});
 let bx=7,by=7,ax=0,ay=0,gx=null,gy=null;
 for(const c of xs)for(const v of[x,x+o.w/2,x+o.w]){const d=c-v;if(Math.abs(d)<bx){bx=Math.abs(d);ax=d;gx=c}}
 for(const c of ys)for(const v of[y,y+o.h/2,y+o.h]){const d=c-v;if(Math.abs(d)<by){by=Math.abs(d);ay=d;gy=c}}
 return{x:x+ax,y:y+ay,gx,gy}}
function guides(gx,gy){const sl=$('#fr .sl');if(!sl)return;sl.querySelectorAll('.gd').forEach(g=>g.remove());if(gx!=null)sl.insertAdjacentHTML('beforeend',`<i class="gd gv" style="left:${gx}px"></i>`);if(gy!=null)sl.insertAdjacentHTML('beforeend',`<i class="gd gh" style="top:${gy}px"></i>`)}
fr.addEventListener('pointerdown',e=>{if(e.target.isContentEditable)return;const ob=e.target.closest('.ob');if(!ob){select(null);return}
 const o=find(ob.dataset.id);if(sel!=o.id)select(o.id);if(o.lk)return;const c=e.target.classList,r=ob.getBoundingClientRect();
 dr={o,k:c.contains('hd')?'rz':c.contains('rh')?'rt':'mv',sx:e.clientX,sy:e.clientY,x:o.x,y:o.y,w:o.w,h:o.h,mv:false,el:ob,cx:r.left+r.width/2,cy:r.top+r.height/2}});
function dragStep(e){if(!dr)return;const o=dr.o,dx=(e.clientX-dr.sx)/S,dy=(e.clientY-dr.sy)/S;if(!dr.mv&&Math.abs(dx)+Math.abs(dy)<3)return;if(!dr.mv){snap(true);dr.mv=true}
 if(dr.k=='rt'){let a=Math.atan2(e.clientY-dr.cy,e.clientX-dr.cx)*180/Math.PI+90;if(e.shiftKey)a=Math.round(a/15)*15;a=Math.round(a);if(a>180)a-=360;o.rot=a;dr.el.style.rotate=a+'deg';return}
 if(dr.k=='rz'){const r=-(o.rot||0)*Math.PI/180,rx=dx*Math.cos(r)-dy*Math.sin(r),ry=dx*Math.sin(r)+dy*Math.cos(r);let w=Math.max(30,dr.w+rx),h=Math.max(3,dr.h+ry);if(e.shiftKey)h=w*dr.h/dr.w;o.w=Math.round(w);o.h=Math.round(h)}
 else{let x=dr.x+dx,y=dr.y+dy,gx=null,gy=null;if(SNAP&&!e.altKey){const s=snapPos(o,x,y);x=s.x;y=s.y;gx=s.gx;gy=s.gy}o.x=Math.round(x);o.y=Math.round(y);guides(gx,gy)}
 Object.assign(dr.el.style,{left:o.x+'px',top:o.y+'px',width:o.w+'px',height:o.h+'px'})}
addEventListener('pointermove',e=>{if(!dr)return;pe=e;if(!raf)raf=requestAnimationFrame(()=>{raf=0;dragStep(pe)})});
addEventListener('pointerup',()=>{if(dr){if(dr.mv){changed();pane()}guides(null,null)}dr=null});
fr.addEventListener('dblclick',e=>{const k=e.target.closest('[data-k]');if(!k)return;const o=find(k.closest('.ob').dataset.id),key=k.dataset.k;if(o.lk)return;snap(true);k.contentEditable=true;k.focus();
 k.onblur=()=>{k.onblur=null;k.contentEditable=false;o.p[key]=k.innerText.replace(/\n+$/,'');redraw(o);changed();pane()};k.onkeydown=ev=>{if(ev.key=='Escape')k.blur()}});

/* ---------- undo / redo / save ---------- */
function snap(force){const n=Date.now();if(!force&&n-lastSnap<600&&hist.length)return;lastSnap=n;hist.push(JSON.stringify(deck));fut=[];if(hist.length>80)hist.shift()}
function restore(s){deck=JSON.parse(s);cur=Math.min(cur,deck.slides.length-1);sel=null;if(tab=='edit')tab='add';tabsUI();full();changed(true)}
const undo=()=>{if(!hist.length)return;fut.push(JSON.stringify(deck));restore(hist.pop())},redo=()=>{if(!fut.length)return;hist.push(JSON.stringify(deck));restore(fut.pop())};
function changed(a){dirty=true;allT=allT||!!a;stat('Unsaved');clearTimeout(tA);tA=setTimeout(save,2000);clearTimeout(tT);tT=setTimeout(()=>{allT?thumbs():thumbOne();allT=false},250)}
$('#un').onclick=undo;$('#re').onclick=redo;
async function save(){clearTimeout(tA);if(saving||!dirty)return;saving=true;stat('Saving…');const body={title:deck.title||'Untitled',data:deck};
 try{if(id)await api('decks/'+id,'PUT',body);else id=(await api('decks','POST',body)).id;dirty=false;stat('✓ Saved to your account')}catch(e){stat(e.message)}saving=false}

$('#ttl').oninput=e=>{deck.title=e.target.value;changed()};
addEventListener('visibilitychange',()=>{if(document.hidden&&dirty)save()});
$('#exit').onclick=async()=>{if(dirty)await save();(parent!==window&&parent.closePPT)?parent.closePPT():location.href='/'};

 p.innerHTML=`<div class="pw" style="--trn:${TRN[sl.tr||'fade']||'trfade'}">${slideHTML(sl,deck.theme,'pm')}</div>`;
 const e=p.querySelector('.sl');e.style.cssText+=`;transform:scale(${s});left:${(innerWidth-1280*s)/2}px;top:${(innerHeight-720*s)/2}px`;void e.offsetWidth;e.classList.add('on');

function ask(msg,o={}){return new Promise(res=>{const m=$('#dlg');m.hidden=false;
 m.innerHTML=`<div class="mb dlg" role="dialog" aria-modal="true"><h3>${esc(o.title||'Please confirm')}</h3><p>${nl(msg)}</p>${o.input!==undefined?`<input id="dlgi" value="${esc(o.input)}" maxlength="30">`:''}<div class="btns"><button id="dlgc">${o.cancel||'Cancel'}</button><button id="dlgo" class="${o.danger?'dng':'on'}">${o.ok||'OK'}</button></div></div>`;

 m.onclick=e=>{if(e.target===m)done(null)};m.onkeydown=e=>{if(e.key=='Escape')done(null);else if(e.key=='Enter'&&e.target.tagName!='BUTTON'){e.preventDefault();$('#dlgo').click()}};
 (i||$('#dlgc')).focus();if(i)i.select()})}
let toT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toT);toT=setTimeout(()=>t.classList.remove('on'),3200)}
const toHSL=([r,g,b])=>{r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2,d=M-m;let h=0,s=0;if(d){s=d/(1-Math.abs(2*l-1));h=M==r?((g-b)/d)%6:M==g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return[Math.round(h),Math.round(s*100),Math.round(l*100)]};
const fromHSL=(h,s,l)=>{s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return hex([f(0)*255,f(8)*255,f(4)*255])};
let cpT=null;
function openCP(btn){const inp=btn.nextElementSibling;cpT={btn,inp};const th=TH(deck.theme),all=[...new Set([th.a1,th.a2,th.bg,th.ink,'#000000','#ffffff','#808080',...Object.values(PAL).flat()])].slice(0,48),c=rgbOf(inp.value)||[255,255,255],[h,s,l]=toHSL(c),p=$('#cpk');
 p.innerHTML=`<div class="cpb"><div class="cph"><b>Pick a colour</b><button data-cpx>Done</button></div><div class="cpv"></div><label>Hue<input type="range" id="ch" min="0" max="360" value="${h}"></label><label>Saturation<input type="range" id="cs2" min="0" max="100" value="${s}"></label><label>Lightness<input type="range" id="cl" min="0" max="100" value="${l}"></label><label>Or type a colour (name, #hex, rgb…)<input id="cx" value="${hex(c)}" spellcheck="false"></label><div class="csw">${all.map(x=>`<button data-cc="${x}" style="background:${x}" aria-label="${x}"></button>`).join('')}</div></div>`;
 p.hidden=false;const r=btn.getBoundingClientRect(),w=Math.min(290,innerWidth-16),box=p.firstElementChild;box.style.width=w+'px';
 p.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';p.style.top=Math.max(8,Math.min(r.bottom+6,innerHeight-box.offsetHeight-8))+'px';$('#cpk .cpv').style.background=hex(c)}
function closeCP(){$('#cpk').hidden=true;cpT=null}
function setCP(x,from){const c=rgbOf(x);if(!c||!cpT)return;x=hex(c);$('#cpk .cpv').style.background=x;cpT.btn.style.background=x;cpT.inp.value=x;cpT.inp.dispatchEvent(new Event('input',{bubbles:true}));
 if(from!='s'){const[h,s,l]=toHSL(c);$('#ch').value=h;$('#cs2').value=s;$('#cl').value=l}if(from!='t')$('#cx').value=x}
$('#cpk').addEventListener('input',e=>{const t=e.target;if(['ch','cs2','cl'].includes(t.id))setCP(fromHSL(+$('#ch').value,+$('#cs2').value,+$('#cl').value),'s');else if(t.id=='cx')setCP(t.value,'t')});
$('#cpk').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.cc)setCP(b.dataset.cc);else if(b.dataset.cpx!==undefined)closeCP()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-cpb]');if(b){e.preventDefault();openCP(b);return}if(!e.target.closest('#cpk'))closeCP()});
const TOUR=[
 {el:'#thumbs',t:'Your slides',x:'Every slide in your deck is listed here. Tap one to open it, drag it to reorder, and use the buttons underneath to add, duplicate or delete slides.'},
 {el:'#side',t:'Step 1 · Insert',x:'Open the Insert tab and tap anything (a title, card, chart, stepper…) to drop it onto the slide. It pops in so you can see where it landed.',tab:'add'},
 {el:'#sw',t:'Step 2 · Move it around',x:'Drag an object to move it. Pull the square corner to resize it and the round dot above it to rotate. Double-click any text to type. Pink lines help you line things up.'},
 {el:'#qa',t:'Quick actions',x:'When something is selected this bar lets you duplicate, delete, lock, reorder or style it with one tap.'},
 {el:'#side',t:'Step 3 · Format',x:'The Format tab changes the selected object: colours, text, shadow and, importantly, how it animates in when you present.',tab:'edit'},
 {el:'#side',t:'Slide and Design',x:'Slide sets the background, transition and notes for one slide. Design restyles the whole deck with colours, fonts and ready-made looks.',tab:'deck'},
 {el:'#pr',t:'Step 4 · Present',x:'Press Present to play your deck full screen with every animation. Arrow keys or taps move between slides and Esc exits. Everything saves automatically.'}];
let ti=0;
function tour(i){ti=i;const s=TOUR[i];if(s.tab){tab=s.tab;if(tab=='edit'&&!sel){const o=deck.slides[cur].objs[0];if(o){sel=o.id;markSel()}}tabsUI();pane()}
 const r=$(s.el).getBoundingClientRect(),W=Math.min(320,innerWidth-20),H=210,m=14;let x,y;
 if(r.right+W+m<innerWidth){x=r.right+m;y=r.top}else if(r.left-W-m>0){x=r.left-W-m;y=r.top}else if(r.bottom+H+m<innerHeight){x=r.left;y=r.bottom+m}else{x=r.left+10;y=r.top+10}
 x=Math.max(10,Math.min(x,innerWidth-W-10));y=Math.max(10,Math.min(y,innerHeight-H-10));
 const b=$('#tour');b.hidden=false;b.innerHTML=`<div class="tsp" style="left:${r.left-6}px;top:${r.top-6}px;width:${r.width+12}px;height:${r.height+12}px"></div><div class="tcard" style="left:${x}px;top:${y}px"><small>${i+1} of ${TOUR.length}</small><h3>${s.t}</h3><p>${s.x}</p><div class="btns">${i?'<button data-tb>Back</button>':''}<button data-tn class="on">${i==TOUR.length-1?'Finish':'Next'}</button><button data-tx>Skip tour</button></div></div>`}
function tourEnd(){$('#tour').hidden=true;$('#tour').innerHTML='';try{localStorage.setItem('ppt_seen','1')}catch{}}
$('#tour').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tn!==undefined){ti>=TOUR.length-1?tourEnd():tour(ti+1)}else if(b.dataset.tb!==undefined)tour(ti-1);else if(b.dataset.tx!==undefined)tourEnd()});

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{const k=e.key;
 if(!$('#pres').hidden){if(k=='Escape')endP();else if(k=='n'||k=='N'){notesOn=!notesOn;pshow()}else if([' ','ArrowRight','ArrowDown','PageDown'].includes(k)){e.preventDefault();pgo(1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(k)){e.preventDefault();pgo(-1)}return}
 if(k=='Escape'&&!$('#cpk').hidden){closeCP();return}if(k=='Escape'&&!$('#tour').hidden){tourEnd();return}
 if(!$('#dlg').hidden||!$('#modal').hidden||!$('#tour').hidden||!$('#cpk').hidden)return;
 const a=document.activeElement;if(a&&(a.isContentEditable||/INPUT|TEXTAREA|SELECT/.test(a.tagName)))return;
 const o=curObj(),c=e.ctrlKey||e.metaKey,K=k.toLowerCase();
 if(k=='F5'){e.preventDefault();present();return}
 if(c&&K=='s'){e.preventDefault();$('#sv').click();return}
 if(c&&K=='z'){e.preventDefault();e.shiftKey?redo():undo();return}if(c&&K=='y'){e.preventDefault();redo();return}
 if(c&&K=='v'&&clip){e.preventDefault();snap(true);const n=JSON.parse(clip);n.id=uid();n.x+=24;n.y+=24;deck.slides[cur].objs.push(n);render();select(n.id);changed();return}
 if(k=='Escape'){select(null);return}
 if(!o)return;
 if(c&&K=='c'){clip=JSON.stringify(o);toast('Copied. Press Ctrl+V to paste.');return}
 if(c&&K=='x'){clip=JSON.stringify(o);delObj();return}
 if(c&&K=='d'){e.preventDefault();dupObj();return}
 if(k=='Delete'||k=='Backspace'){e.preventDefault();delObj();return}
 if(o.lk)return;
 const st=e.shiftKey?10:1,m={ArrowLeft:['x',-st],ArrowRight:['x',st],ArrowUp:['y',-st],ArrowDown:['y',st]}[k];if(m){e.preventDefault();snap();o[m[0]]+=m[1];redraw(o);changed()}});

/* ---------- start ---------- */
(async()=>{deck=starter();full();
 try{const{decks}=await api('decks');if(decks.length)await openDeck(decks[0].id);else await newDeck()}catch(e){stat(e.message)}})();
</script>
