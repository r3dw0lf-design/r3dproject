<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RETROOS 86</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--fg:#33ff66;--dim:#1a8c3a;--bg:#031108}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#050505;color:var(--fg);font:22px/1.15 'VT323','Courier New',monospace;overflow:hidden}
#screen{position:fixed;inset:10px;border-radius:32px/26px;background:var(--bg);overflow:hidden;text-shadow:0 0 5px var(--fg);box-shadow:0 0 0 6px #1b1b1b,0 0 60px color-mix(in srgb,var(--fg) 35%,transparent),inset 0 0 140px rgba(0,0,0,.85);animation:flick 4s infinite}
#screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
#screen::before{content:"";position:absolute;left:0;right:0;height:90px;z-index:9998;pointer-events:none;background:linear-gradient(transparent,rgba(255,255,255,.05),transparent);animation:roll 7s linear infinite}
@keyframes roll{from{top:-100px}to{top:100%}}
@keyframes flick{0%,100%{opacity:1}92%{opacity:.97}93%{opacity:.9}94%{opacity:1}}
@media(prefers-reduced-motion:reduce){#screen,#screen::before{animation:none}}
button,input,textarea{font:inherit;color:inherit;text-shadow:inherit}
button{background:transparent;border:2px solid var(--fg);padding:2px 12px;cursor:pointer}
button:hover,button.on{background:var(--fg);color:var(--bg);text-shadow:none}
:focus-visible{outline:2px dashed var(--fg);outline-offset:2px}
input,textarea{background:rgba(0,0,0,.35);border:2px solid var(--dim);padding:3px 8px;width:100%;caret-color:var(--fg)}
[hidden]{display:none!important}
#boot{position:absolute;inset:0;padding:28px;margin:0;white-space:pre-wrap;font:inherit}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow:auto}
.logo{margin:0;font-size:17px;line-height:1;text-align:center}
.box{width:min(380px,100%);border:2px solid var(--fg);padding:16px;display:grid;gap:10px;background:rgba(0,0,0,.25)}
.tabs{display:flex;gap:8px}.tabs button{flex:1}
label{display:grid;gap:3px}
#msg{min-height:1.2em;color:#ff6b4a;text-shadow:0 0 5px #ff6b4a}
.cur::after{content:"█";animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
/* desktop */
#desk{position:absolute;inset:0}
#icons{position:absolute;top:14px;left:14px;display:grid;gap:14px}
.ico{width:92px;text-align:center;background:none;border:0;padding:4px}
.ico b{display:block;font-size:42px;font-weight:400;border:2px solid var(--fg);margin:0 auto 3px;width:60px;height:52px;line-height:50px}
.ico:hover b,.ico:hover{background:none;color:var(--fg)}.ico:hover b{background:var(--dim)}
#wins{position:absolute;inset:0 0 38px 0}
.win{position:absolute;display:flex;flex-direction:column;background:var(--bg);border:2px solid var(--fg);box-shadow:6px 6px 0 rgba(0,0,0,.6);min-width:220px}
.win .tb{display:flex;justify-content:space-between;align-items:center;background:var(--fg);color:var(--bg);text-shadow:none;padding:0 6px;cursor:move;touch-action:none;user-select:none}
.win .tb button{border-color:var(--bg);padding:0 8px;line-height:1.1;color:var(--bg)}
.win .tb button:hover{background:var(--bg);color:var(--fg)}
.win .bd{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px;overflow:auto}
.win textarea{flex:1;resize:none;min-height:0}
#bar{position:absolute;left:0;right:0;bottom:0;height:38px;display:flex;align-items:center;gap:8px;padding:0 8px;border-top:2px solid var(--fg);background:var(--bg)}
#tasks{flex:1;display:flex;gap:6px;overflow:hidden}
#menu{position:absolute;left:8px;bottom:42px;border:2px solid var(--fg);background:var(--bg);display:grid;min-width:190px}
#menu button{border:0;text-align:left;padding:4px 12px}
#term{white-space:pre-wrap;word-break:break-word;flex:1;overflow:auto}
.tin{display:flex;gap:6px}.tin input{border:0;background:none;padding:0}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* ===== normal-OS behaviour: windows, file icons, selection ===== */
#wins{pointer-events:none}.win{pointer-events:auto;overflow:hidden;resize:both}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;resize:none}
.win .tb span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.win .bd.fr{padding:0;overflow:hidden}.win .bd.fr iframe{flex:1;width:100%;border:0;min-height:0;background:#06100d}
#files{position:absolute;top:14px;left:124px;bottom:52px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,minmax(96px,96px));gap:10px 12px;align-content:start;justify-content:start}
.ico.sel{outline:2px dashed var(--fg);outline-offset:-2px}.ico.sel b{background:var(--dim)}
.ico .lbl{display:block;font-size:19px;line-height:1;max-height:2.1em;overflow:hidden;word-break:break-word}
#desk.dz:after{content:"DROP YOUR .HTML PRESENTATION TO IMPORT IT";position:absolute;inset:10px 10px 48px;display:grid;place-items:center;border:3px dashed var(--fg);background:rgba(0,0,0,.6);pointer-events:none;z-index:5}

/* ===== free-form desktop: icons you can drag, folders, context menus ===== */
#icons{inset:0 0 38px 0;display:block}
.ico{display:block;cursor:pointer;color:var(--fg);touch-action:none;user-select:none}
.ico.abs{position:absolute}
.ico:focus-visible{outline:2px dashed var(--fg)}
.ico.dropt,.win .bd.fold.dropt{outline:2px dashed var(--fg);outline-offset:-3px;background:rgba(255,255,255,.05)}
.ico b.fold{position:relative;font-size:0;margin-top:8px}
.ico b.fold:before{content:"";position:absolute;left:5px;top:-10px;width:26px;height:8px;border:2px solid var(--fg);border-bottom:0;background:var(--bg)}
.ico b.fold:after{content:"";position:absolute;left:8px;right:8px;top:14px;height:2px;background:var(--fg);box-shadow:0 8px 0 var(--fg),0 16px 0 var(--fg)}
.ico b.lnk{position:relative}
.ico b.lnk:after{content:"\2197";position:absolute;right:-3px;bottom:-3px;font-size:19px;line-height:1;background:var(--bg);border:1px solid var(--fg);padding:0 2px}
.ico .lbl input{width:100%;font-size:19px;line-height:1;padding:0 2px;text-align:center;border:1px solid var(--fg);background:var(--bg)}
.ghost{position:fixed;z-index:9500;pointer-events:none;opacity:.8}
.win .bd.fold{flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:10px;padding:10px}
.win .bd.fold .ico{position:relative}.win .bd .empty{opacity:.55;padding:6px;width:100%}
.cm{position:absolute;z-index:9000;min-width:210px;border:2px solid var(--fg);background:var(--bg);box-shadow:6px 6px 0 rgba(0,0,0,.6);padding:2px;font-size:21px}
.cm button{display:flex;justify-content:space-between;gap:18px;width:100%;border:0;text-align:left;padding:3px 12px}
.cm hr{border:0;border-top:1px solid var(--dim);margin:3px 0}
.cm .has{position:relative}.cm .sub{display:none;position:absolute;left:100%;top:-4px;min-width:190px;border:2px solid var(--fg);background:var(--bg);padding:2px;box-shadow:6px 6px 0 rgba(0,0,0,.6)}
.cm .has:hover>.sub,.cm .has.open>.sub{display:block}.cm.flip .sub{left:auto;right:100%}
</style></head>
<body>
<div id="screen">
  <pre id="boot"></pre>

  <div id="login" class="center" hidden>
    <pre class="logo">█▀█ █▀▀ ▀█▀ █▀█ █▀█ █▀ ░░ █▀▀ █▀▀
█▀▄ ██▄ ░█░ █▀▄ █▄█ ▄█ ░░ ▄▄█ ▄▄█
~ RETROOS 86 · TERMINAL ACCESS ~</pre>
    <div class="box">
      <div class="tabs"><button data-t="login" class="on">LOGIN</button><button data-t="reg">CREATE ACCOUNT</button></div>
      <label>USERNAME<input id="u" autocomplete="username" maxlength="16" autocapitalize="off" spellcheck="false"></label>
      <label>PASSWORD<input id="p" type="password" autocomplete="current-password"></label>
      <label id="c2" hidden>CONFIRM PASSWORD<input id="p2" type="password" autocomplete="new-password"></label>
      <button id="go">&gt; ENTER</button>
      <div id="msg" role="alert"></div>
    </div>
  </div>

  <div id="desk" hidden>
    <div id="icons"></div><div id="ctx" class="cm" hidden></div><div id="wins"></div>
    <div id="menu" hidden></div>
    <div id="bar"><button id="start">[RETROOS]</button><div id="tasks"></div><span id="clk"></span></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s), sleep=ms=>new Promise(r=>setTimeout(r,ms));
let USER='', mode='login';
async function api(p,m='GET',b){
  const r=await fetch('/api/'+p,{method:m,headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});
  let d={};try{d=await r.json()}catch{}
  if(!r.ok)throw new Error(d.error||'SYSTEM ERROR ('+r.status+')');return d;
}
/* theme */
const THEMES={GREEN:['#33ff66','#1a8c3a','#031108'],AMBER:['#ffb000','#8c6000','#120b00'],CYAN:['#4df3ff','#1f8a94','#021214'],WHITE:['#e6e6e6','#7a7a7a','#0b0b0b']};
function theme(n){const t=THEMES[n];if(!t)return false;const s=document.documentElement.style;s.setProperty('--fg',t[0]);s.setProperty('--dim',t[1]);s.setProperty('--bg',t[2]);try{localStorage.setItem('rtheme',n)}catch{}return true}
try{theme(localStorage.getItem('rtheme'))}catch{}

/* boot */
async function boot(lines,fast){const b=$('#boot');b.hidden=false;b.textContent='';for(const l of lines){b.textContent+=l+'\n';await sleep(fast?60:150)}await sleep(fast?150:350);b.hidden=true}
async function start(){
  await boot(['RETROOS BIOS v1.986','(C) 1986 RETRO SYSTEMS INC.','','MEMORY TEST ........ 640K OK','DETECTING DRIVES ... A: B: C:','LINKING TO SERVER ..','']);
  try{const d=await api('me');USER=d.username;desktop()}catch{showLogin()}
}
/* login */
function showLogin(){$('#desk').hidden=true;$('#login').hidden=false;$('#msg').textContent='';$('#u').focus()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  mode=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('#c2').hidden=mode!=='reg';$('#p').autocomplete=mode==='reg'?'new-password':'current-password';$('#msg').textContent='';
});
async function submit(){
  const u=$('#u').value.trim(),p=$('#p').value,m=$('#msg');m.style.color='';m.textContent='';
  if(mode==='reg'&&p!==$('#p2').value){m.textContent='PASSWORDS DO NOT MATCH';return}
  $('#go').disabled=true;m.textContent='CONNECTING...';m.style.color='var(--fg)';
  try{const d=await api(mode==='reg'?'register':'login','POST',{username:u,password:p});
    USER=d.username;$('#p').value=$('#p2').value='';$('#login').hidden=true;
    await boot(['WELCOME, '+USER.toUpperCase(),'MOUNTING USER DRIVE ... OK','STARTING RETROOS ...'],true);desktop();
  }catch(e){m.style.color='';m.textContent=e.message}
  $('#go').disabled=false;
}
$('#go').onclick=submit;
['u','p','p2'].forEach(i=>$('#'+i).addEventListener('keydown',e=>{if(e.key==='Enter')submit()}));

/* desktop + windows */
const APPS={
  notes:{t:'NOTEPAD',i:'✎',w:420,h:320,init:notes},
  term:{t:'TERMINAL',i:'>_',w:480,h:320,init:term},
  set:{t:'DISPLAY',i:'☼',w:320,h:190,init:settings},
  ppt:{t:'ADVANCED PPT',i:'▤',w:1100,h:720,max:true,init:pptApp},
  imp:{t:'IMPORT HTML',i:'⬆',w:0,h:0,init(){}},
  about:{t:'ABOUT',i:'?',w:430,h:290,init:about}
};
let z=10,open={};
function desktop(){
  $('#login').hidden=true;$('#desk').hidden=false;
  $('#icons').innerHTML='';
  $('#menu').innerHTML=Object.keys(APPS).map(k=>`<button data-a="${k}">${APPS[k].t}</button>`).join('')+`<button data-a="out">LOG OUT (${USER})</button>`;
  dkLoad().then(()=>launch('about'));
}
$('#start').onclick=e=>{e.stopPropagation();$('#menu').hidden=!$('#menu').hidden};
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))$('#menu').hidden=true});
$('#menu').onclick=e=>{const a=e.target.dataset.a;if(!a)return;$('#menu').hidden=true;a==='out'?logout():launch(a)};
async function logout(){closePPT();await dkFlush();try{await api('logout','POST',{})}catch{}
  for(const k in open)closeWin(k);DK={items:[]};$('#icons').innerHTML='';hideCtx();USER='';$('#desk').hidden=true;await boot(['SAVING SESSION ...','LOGGED OUT.'],true);showLogin()}
setInterval(()=>{$('#clk').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})},1000);

window.closePPT=()=>closeWin('ppt');
function makeWin(k,o){
  const box=$('#wins').getBoundingClientRect();
  const w=Math.min(o.w,box.width-8),h=Math.min(o.h,box.height-8),n=Object.keys(open).length;
  const el=document.createElement('div');el.className='win';
  el.style.cssText=`width:${w}px;height:${h}px;left:${Math.max(4,Math.min(130+n*28,box.width-w-4))}px;top:${Math.max(4,Math.min(30+n*28,box.height-h-4))}px`;
  el.innerHTML=`<div class="tb"><span></span><span><button data-m aria-label="Minimize">_</button> <button data-z aria-label="Maximize">□</button> <button data-x aria-label="Close">X</button></span></div><div class="bd"></div>`;
  $('#wins').append(el);
  const t=document.createElement('button');$('#tasks').append(t);
  open[k]={el,t,tt:el.querySelector('.tb span')};setTitle(k,o.title);
  t.onclick=()=>{el.hidden=!el.hidden;if(!el.hidden)focus(k)};
  el.querySelector('[data-x]').onclick=()=>closeWin(k);
  el.querySelector('[data-m]').onclick=()=>{el.hidden=true;t.classList.remove('on')};
  const mx=()=>el.classList.toggle('max');el.querySelector('[data-z]').onclick=mx;el.querySelector('.tb').ondblclick=e=>{if(!e.target.closest('button'))mx()};
  el.addEventListener('pointerdown',()=>focus(k));
  const tb=el.querySelector('.tb');
  tb.onpointerdown=e=>{if(e.target.closest('button')||el.classList.contains('max'))return;const dx=e.clientX-el.offsetLeft,dy=e.clientY-el.offsetTop;tb.setPointerCapture(e.pointerId);
    tb.onpointermove=m=>{const B=$('#wins');el.style.left=Math.max(0,Math.min(m.clientX-dx,B.clientWidth-60))+'px';el.style.top=Math.max(0,Math.min(m.clientY-dy,B.clientHeight-28))+'px'};
    tb.onpointerup=()=>{tb.onpointermove=null}};
  o.init(el.querySelector('.bd'),k);if(o.max)el.classList.add('max');focus(k);
}
function setTitle(k,t){const o=open[k];if(!o)return;o.tt.textContent=t;o.t.textContent=t}
function launch(k,arg){
  if(k==='imp')return pickHtml();
  const a=APPS[k];if(!a)return;
  if(open[k]){focus(k);open[k].el.hidden=false;if(arg&&open[k].open)open[k].open(arg);return}
  makeWin(k,{title:a.t,w:a.w,h:a.h,max:a.max,init:(bd,kk)=>a.init(bd,kk,arg)});
}
function focus(k){const o=open[k];if(!o)return;o.el.style.zIndex=++z;for(const x in open)open[x].t.classList.toggle('on',x===k)}
function closeWin(k){const o=open[k];if(!o)return;o.el.remove();o.t.remove();delete open[k];if(k==='ppt'){PPT.f=null;syncDecks()}}

/* apps */
function notes(bd){
  bd.innerHTML='<textarea spellcheck="false" placeholder="Type here. Saved to your account on the server."></textarea><div class="st">LOADING...</div>';
  const ta=bd.querySelector('textarea'),st=bd.querySelector('.st');let tm;
  api('notes').then(d=>{ta.value=d.notes;st.textContent='READY'}).catch(e=>st.textContent=e.message);
  ta.oninput=()=>{st.textContent='EDITING...';clearTimeout(tm);tm=setTimeout(async()=>{try{await api('notes','PUT',{notes:ta.value});st.textContent='SAVED TO SERVER'}catch(e){st.textContent='SAVE FAILED: '+e.message}},700)};
}
function term(bd){
  bd.innerHTML='<div id="term"></div><div class="tin"><span>C:\\&gt;</span><input autocomplete="off" spellcheck="false" autocapitalize="off"></div>';
  const o=bd.querySelector('#term'),i=bd.querySelector('input');
  const say=t=>{o.textContent+=t+'\n';o.scrollTop=o.scrollHeight};
  say('RETROOS COMMAND INTERPRETER. TYPE HELP.');
  bd.onclick=()=>i.focus();setTimeout(()=>i.focus(),50);
  i.onkeydown=async e=>{if(e.key!=='Enter')return;const c=i.value.trim();i.value='';say('C:\\> '+c);const[a,...r]=c.split(/\s+/);
    switch((a||'').toLowerCase()){
      case'':break;
      case'help':say('HELP WHOAMI DATE ECHO DIR TYPE NOTES.TXT COLOR <GREEN|AMBER|CYAN|WHITE> CLS LOGOUT');break;
      case'whoami':say(USER);break;
      case'date':say(new Date().toString());break;
      case'echo':say(r.join(' '));break;
      case'dir':say(' VOLUME: '+USER.toUpperCase()+'\n NOTES.TXT\n 1 FILE(S)');break;
      case'type':try{say((await api('notes')).notes||'(EMPTY FILE)')}catch(x){say(x.message)}break;
      case'color':say(theme((r[0]||'').toUpperCase())?'OK':'UNKNOWN COLOR');break;
      case'cls':o.textContent='';break;
      case'logout':logout();break;
      default:say('BAD COMMAND OR FILE NAME');}};
}
function settings(bd){
  bd.innerHTML='<div>PHOSPHOR COLOR:</div><div class="sw"></div>';
  for(const n in THEMES){const b=document.createElement('button');b.textContent=n;b.onclick=()=>theme(n);bd.querySelector('.sw').append(b)}
}
function about(bd){bd.innerHTML=`<div>RETROOS 86<br>USER: ${USER.toUpperCase()}<br><br>DOUBLE-CLICK AN ICON TO OPEN IT (TAP ON PHONES).<br>DRAG ICONS ANYWHERE, OR ONTO A FOLDER TO PUT THEM INSIDE.<br>RIGHT-CLICK THE DESKTOP: NEW FOLDER / TEXT FILE.<br>RIGHT-CLICK AN ICON: OPEN, RENAME, DELETE (OR F2 / DEL).<br>DECKS LIVE IN ADVANCED PPT - USE ITS [TO DESKTOP] BUTTON FOR A SHORTCUT.<br><br>YOUR NOTES LIVE ON THE SERVER, SO THEY FOLLOW YOUR ACCOUNT.</div>`}

/* ================= desktop model: icons, folders, text files ================= */
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const PPT={f:null,ready:false,q:null};
let DK={items:[]},SEL=null,dkT=null,dkDirty=false,lastDrag=0;
const CW=104,CH=108;
const item=id=>DK.items.find(i=>i.id===id);
const kids=p=>DK.items.filter(i=>(i.p||null)===(p||null));
const descendants=id=>kids(id).flatMap(c=>[c,...descendants(c.id)]);
const clampX=x=>Math.max(0,Math.min(x,$('#icons').clientWidth-96));
const clampY=y=>Math.max(0,Math.min(y,$('#icons').clientHeight-100));
function slot(){const rows=Math.max(1,Math.floor(($('#icons').clientHeight-14)/CH))||6,on=kids(null);
  for(let c=0;c<40;c++)for(let r=0;r<rows;r++){const x=14+c*CW,y=14+r*CH;if(!on.some(i=>Math.abs(i.x-x)<60&&Math.abs(i.y-y)<60))return{x,y}}return{x:14,y:14}}
function defaultDK(){const d={v:1,items:[]};Object.keys(APPS).forEach((k,n)=>d.items.push({id:uid(),t:'app',app:k,x:14,y:14+n*CH,p:null}));return d}
function dkSave(){dkDirty=true;clearTimeout(dkT);dkT=setTimeout(dkFlush,500)}
async function dkFlush(){clearTimeout(dkT);if(!dkDirty||!USER)return;dkDirty=false;try{await fetch('/api/desktop',{method:'PUT',keepalive:true,headers:{'Content-Type':'application/json'},body:JSON.stringify({desktop:DK})})}catch{dkDirty=true}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)dkFlush()});
async function dkLoad(){
  let d=null;try{d=(await api('desktop')).desktop}catch{}
  DK=d&&Array.isArray(d.items)?d:defaultDK();let ch=!d;
  DK.items=DK.items.filter(i=>i.t!=='app'||APPS[i.app]);
  const have=new Set(DK.items.filter(i=>i.t==='app').map(i=>i.app));
  for(const k in APPS)if(!have.has(k)){const s=slot();DK.items.push({id:uid(),t:'app',app:k,x:s.x,y:s.y,p:null});ch=true}
  DK.items.forEach(i=>{if(i.p&&!item(i.p)){const s=slot();i.p=null;i.x=s.x;i.y=s.y;ch=true}});
  if(ch)dkSave();renderAll();syncDecks()}
async function syncDecks(){try{const{decks}=await api('decks');const nm=new Map(decks.map(d=>[d.id,d.title||'Untitled']));let ch=false;
  DK.items=DK.items.filter(i=>{if(i.t==='deck'&&!nm.has(i.deck)){ch=true;return false}return true});
  DK.items.forEach(i=>{if(i.t==='deck'&&!i.custom&&nm.get(i.deck)!==i.name){i.name=nm.get(i.deck);ch=true}});
  if(ch){dkSave();renderAll()}}catch{}}

/* ---- rendering ---- */
function iconFor(i){
  if(i.t==='app'){const a=APPS[i.app];return{g:a.i,l:a.t,c:''}}
  if(i.t==='folder')return{g:'',l:i.name,c:'fold'};
  if(i.t==='text')return{g:'≡',l:i.name,c:''};
  return{g:'▤',l:i.name,c:'lnk'}}
function openItem(i){if(i.t==='app')launch(i.app);else if(i.t==='folder')openFolder(i.id);else if(i.t==='text')openText(i.id);else if(i.t==='deck')launch('ppt',i.deck)}
function select(id){SEL=id;document.querySelectorAll('.ico.sel').forEach(x=>x.classList.remove('sel'));if(id)document.querySelectorAll(`.ico[data-id="${id}"]`).forEach(x=>x.classList.add('sel'))}
function mkIco(i,abs){
  const f=iconFor(i),b=document.createElement('div');b.className='ico'+(abs?' abs':'');b.dataset.id=i.id;b.tabIndex=0;b.setAttribute('role','button');
  if(i.t==='folder')b.dataset.folder=i.id;
  b.title=i.t==='deck'?'Shortcut to the deck “'+i.name+'”':(i.t==='app'?'Double-click to open':i.name);
  b.innerHTML=`<b class="${f.c}">${f.g}</b><span class="lbl">${esc(f.l)}</span>`;
  if(abs){b.style.left=i.x+'px';b.style.top=i.y+'px'}
  if(SEL===i.id)b.classList.add('sel');
  b.onclick=()=>{if(Date.now()-lastDrag<250)return;select(i.id);if(matchMedia('(pointer:coarse)').matches)openItem(i)};
  b.ondblclick=()=>openItem(i);
  b.onkeydown=e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Enter'){e.preventDefault();openItem(i)}};
  b.onpointerdown=e=>startDrag(e,i,b);
  b.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();select(i.id);showCtx(e,itemMenu(i))};
  return b}
function renderAll(){
  const c=$('#icons');c.innerHTML='';kids(null).forEach(i=>c.append(mkIco(i,true)));
  for(const k of Object.keys(open)){
    if(k.startsWith('fld:')||k.startsWith('txt:')){const it=item(k.slice(4));if(!it){closeWin(k);continue}setTitle(k,k[0]==='t'?'NOTEPAD - '+it.name:it.name);if(k[0]==='f')renderFolder(k.slice(4))}}}
function renderFolder(id){const o=open['fld:'+id];if(!o)return;const bd=o.el.querySelector('.bd');bd.innerHTML='';const l=kids(id);
  l.forEach(i=>bd.append(mkIco(i,false)));if(!l.length)bd.innerHTML='<div class="empty">(EMPTY — DRAG ICONS HERE, OR RIGHT-CLICK → NEW)</div>'}
function openFolder(id){const f=item(id);if(!f)return;const k='fld:'+id;if(open[k]){focus(k);open[k].el.hidden=false;return}
  makeWin(k,{title:f.name,w:460,h:320,init:bd=>{bd.classList.add('fold');bd.dataset.folder=id;
    bd.oncontextmenu=e=>{if(e.target.closest('.ico'))return;e.preventDefault();e.stopPropagation();showCtx(e,[newMenu(id)])};renderFolder(id)}})}
function openText(id){const t=item(id);if(!t)return;const k='txt:'+id;if(open[k]){focus(k);open[k].el.hidden=false;return}
  makeWin(k,{title:'NOTEPAD - '+t.name,w:440,h:340,init:bd=>{
    bd.innerHTML='<textarea spellcheck="false" placeholder="Type here. Saved to your account."></textarea><div class="st">SAVED</div>';
    const ta=bd.querySelector('textarea'),st=bd.querySelector('.st');ta.value=t.text||'';let tm;
    ta.oninput=()=>{const x=item(id);if(!x)return;x.text=ta.value.slice(0,200000);st.textContent='EDITING...';clearTimeout(tm);tm=setTimeout(()=>{dkSave();st.textContent='SAVED TO SERVER'},400)};
    setTimeout(()=>ta.focus(),50)}})}

/* ---- create / rename / delete ---- */
function uniq(name,p,except){const sib=kids(p).filter(i=>i.t!=='app'&&i.id!==except).map(i=>i.name.toLowerCase());if(!sib.includes(name.toLowerCase()))return name;
  const m=/^(.*?)(\.[^.]+)?$/.exec(name),b=m[1],x=m[2]||'';for(let n=2;;n++){const c=`${b} (${n})${x}`;if(!sib.includes(c.toLowerCase()))return c}}
function createItem(o){const p=o.p||null,it={id:uid(),t:o.t,name:uniq(o.name,p),p,x:0,y:0};if(o.t==='text')it.text='';
  if(!p){const s=o.x!=null?{x:o.x,y:o.y}:slot();it.x=s.x;it.y=s.y}
  DK.items.push(it);dkSave();renderAll();select(it.id);startRename(it.id)}
function startRename(id){const it=item(id);if(!it||it.t==='app')return;const l=document.querySelector(`.ico[data-id="${id}"] .lbl`);if(!l)return;
  const inp=document.createElement('input');inp.value=it.name;inp.maxLength=60;inp.spellcheck=false;l.textContent='';l.append(inp);let done=false;
  const fin=ok=>{if(done)return;done=true;if(ok){const v=inp.value.trim();if(v&&v!==it.name){it.name=uniq(v,it.p||null,id);if(it.t==='deck')it.custom=true;dkSave()}}renderAll()};
  inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')fin(true);else if(e.key==='Escape')fin(false)};
  inp.onblur=()=>fin(true);inp.onclick=inp.ondblclick=inp.onpointerdown=e=>e.stopPropagation();
  setTimeout(()=>{inp.focus();const d=it.t==='text'?it.name.lastIndexOf('.'):-1;inp.setSelectionRange(0,d>0?d:inp.value.length)},0)}
function delItem(id){const it=item(id);if(!it||it.t==='app')return;const sub=descendants(id),n=sub.filter(x=>x.t!=='app').length;
  const msg=it.t==='deck'?`Remove the shortcut “${it.name}” from the desktop?\n(The deck itself stays in Advanced PPT.)`:(it.t==='folder'&&n?`Delete the folder “${it.name}” and the ${n} item(s) inside it?`:`Delete “${it.name}”?`);
  if(!confirm(msg))return;
  const gone=new Set([id]);sub.forEach(x=>{if(x.t==='app'){x.p=null;const s=slot();x.x=s.x;x.y=s.y}else gone.add(x.id)});
  DK.items=DK.items.filter(x=>!gone.has(x.id));gone.forEach(g=>{closeWin('fld:'+g);closeWin('txt:'+g)});if(SEL&&gone.has(SEL))SEL=null;dkSave();renderAll()}

/* ---- right-click menus ---- */
const newMenu=(p,x,y)=>({t:'New',sub:[{t:'Folder',f:()=>createItem({t:'folder',name:'New Folder',p,x,y})},{t:'Text file',f:()=>createItem({t:'text',name:'New Text Document.txt',p,x,y})}]});
function itemMenu(i){const r=[{t:'Open',f:()=>openItem(i)}];
  if(i.t!=='app'){r.push('-',{t:'Rename',f:()=>startRename(i.id)},{t:i.t==='deck'?'Remove from desktop':'Delete',f:()=>delItem(i.id)})}return r}
function showCtx(e,rows){const c=$('#ctx'),D=$('#desk').getBoundingClientRect();c.innerHTML='';
  for(const r of rows){if(r==='-'){c.append(document.createElement('hr'));continue}
    const b=document.createElement('button');b.innerHTML=`<span>${r.t}</span>${r.sub?'<span>▸</span>':''}`;
    if(r.sub){const w=document.createElement('div');w.className='has',s=document.createElement('div');s.className='sub';
      r.sub.forEach(x=>{const sb=document.createElement('button');sb.textContent=x.t;sb.onclick=ev=>{ev.stopPropagation();hideCtx();x.f()};s.append(sb)});
      b.onclick=ev=>{ev.stopPropagation();w.classList.toggle('open')};w.append(b,s);c.append(w)}
    else{b.onclick=ev=>{ev.stopPropagation();hideCtx();r.f()};c.append(b)}}
  c.hidden=false;let x=e.clientX-D.left,y=e.clientY-D.top;const W=c.offsetWidth,H=c.offsetHeight;
  if(x+W>D.width-6)x=Math.max(0,D.width-W-6);if(y+H>D.height-6)y=Math.max(0,D.height-H-6);
  c.style.left=x+'px';c.style.top=y+'px';c.classList.toggle('flip',x+W+200>D.width)}
function hideCtx(){const c=$('#ctx');if(c)c.hidden=true}
$('#desk').addEventListener('contextmenu',e=>{if(e.target.closest('.win,#bar,#menu,#ctx'))return;e.preventDefault();const D=$('#icons').getBoundingClientRect();
  showCtx(e,[newMenu(null,clampX(e.clientX-D.left-46),clampY(e.clientY-D.top-30)),'-',{t:'Open in Terminal',f:()=>launch('term')}])});
document.addEventListener('click',e=>{if(!e.target.closest('#ctx'))hideCtx();if(!e.target.closest('.ico')){SEL=null;document.querySelectorAll('.ico.sel').forEach(x=>x.classList.remove('sel'))}});
addEventListener('blur',hideCtx);
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideCtx();
  const tg=document.activeElement&&document.activeElement.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||$('#desk').hidden||!SEL)return;
  if(e.key==='F2'){e.preventDefault();startRename(SEL)}else if(e.key==='Delete'){e.preventDefault();delItem(SEL)}});

/* ---- drag icons: move anywhere, or drop onto a folder / folder window ---- */
function canMove(it,fid){return fid!==it.id&&!descendants(it.id).some(d=>d.id===fid)}
function dropTarget(x,y,it){const t=document.elementFromPoint(x,y);if(!t)return{t:null};
  const fi=t.closest('.ico[data-folder]');if(fi&&fi.dataset.id!==it.id)return{t,el:fi,fid:fi.dataset.id};
  const fb=t.closest('.bd.fold');if(fb)return{t,el:fb,fid:fb.dataset.folder};return{t}}
function startDrag(e,it,el){
  if(e.button!==0||e.target.tagName==='INPUT')return;
  const sx=e.clientX,sy=e.clientY,r0=el.getBoundingClientRect(),ox=sx-r0.left,oy=sy-r0.top;let ghost=null,over=null;
  const mv=m=>{const dx=m.clientX-sx,dy=m.clientY-sy;
    if(!ghost){if(Math.hypot(dx,dy)<6)return;ghost=el.cloneNode(true);ghost.classList.remove('abs','sel');ghost.classList.add('ghost');ghost.style.cssText=`left:${r0.left}px;top:${r0.top}px;width:92px`;$('#screen').append(ghost);el.style.opacity='.35'}
    ghost.style.transform=`translate(${dx}px,${dy}px)`;
    const d=dropTarget(m.clientX,m.clientY,it),nt=d.el&&canMove(it,d.fid)?d.el:null;
    if(nt!==over){if(over)over.classList.remove('dropt');over=nt;if(over)over.classList.add('dropt')}};
  const up=u=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
    if(!ghost)return;lastDrag=Date.now();ghost.remove();el.style.opacity='';if(over)over.classList.remove('dropt');
    const d=dropTarget(u.clientX,u.clientY,it);
    if(d.fid){if(!canMove(it,d.fid)){renderAll();return}it.p=d.fid;it.x=it.y=0}
    else if(d.t&&!d.t.closest('.win,#bar,#menu,#ctx')&&d.t.closest('#desk')){const D=$('#icons').getBoundingClientRect();it.p=null;it.x=clampX(u.clientX-D.left-ox);it.y=clampY(u.clientY-D.top-oy)}
    else{renderAll();return}
    dkSave();renderAll();select(it.id)};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)}

/* ================= Advanced PPT window + HTML import ================= */
function pptApp(bd,k,arg){
  bd.classList.add('fr');const f=document.createElement('iframe');
  f.title='Advanced PPT';f.allow='fullscreen; clipboard-write';f.setAttribute('allowfullscreen','');
  f.src='/ppt.html'+(arg?'?open='+encodeURIComponent(arg):'');bd.append(f);
  PPT.f=f;PPT.ready=false;
  open[k].open=id=>{if(PPT.f&&PPT.f.contentWindow)PPT.f.contentWindow.postMessage({retroos:'open',id},'*')}}
function sendImport(){if(PPT.q&&PPT.f&&PPT.ready){PPT.f.contentWindow.postMessage({retroos:'import',name:PPT.q.name,text:PPT.q.text},'*');PPT.q=null}}
function importToPPT(name,text){PPT.q={name,text};launch('ppt');if(open.ppt)open.ppt.el.hidden=false;sendImport()}
function pickHtml(){const i=document.createElement('input');i.type='file';i.accept='.html,.htm,text/html';i.onchange=async()=>{const f=i.files[0];if(f)importToPPT(f.name,await f.text())};i.click()}
addEventListener('message',e=>{const m=e.data;if(!m||!m.retroos||!PPT.f||e.source!==PPT.f.contentWindow)return;
  if(m.retroos==='ready'){PPT.ready=true;sendImport()}
  else if(m.retroos==='saved'){clearTimeout(PPT.t);PPT.t=setTimeout(syncDecks,400)}
  else if(m.retroos==='pin'&&m.id){const ex=DK.items.find(i=>i.t==='deck'&&i.deck===m.id);if(ex){select(ex.id);return}
    const s=slot(),it={id:uid(),t:'deck',deck:m.id,name:String(m.title||'Untitled deck').slice(0,60),p:null,x:s.x,y:s.y};DK.items.push(it);dkSave();renderAll();select(it.id)}});
const isFile=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
$('#desk').addEventListener('dragover',e=>{if(!isFile(e))return;e.preventDefault();$('#desk').classList.add('dz');clearTimeout(PPT.d);PPT.d=setTimeout(()=>$('#desk').classList.remove('dz'),300)});
$('#desk').addEventListener('drop',async e=>{$('#desk').classList.remove('dz');const f=e.dataTransfer.files[0];if(!f)return;e.preventDefault();if(/\.html?$/i.test(f.name))importToPPT(f.name,await f.text())});

start();
</script>
</body></html>
