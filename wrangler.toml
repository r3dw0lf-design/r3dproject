name = "retroos"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# No database_id on purpose: wrangler creates the D1 database for you on the first deploy.
[[d1_databases]]
binding = "DB"
database_name = "retroos"
